name: Build and Deploy to Pages

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "0 8 * * *"   # 毎日 UTC 8:00 = 日本時間 17:00(東証の引け後)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # snapshots/ と .last_run をコミットするため
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create output directory
        run: mkdir -p output snapshots

      # generate.py は snapshots/ の前日分を読み、今日分を書き出す
      - name: Run script to generate HTML
        run: python scripts/generate.py

      - name: Validate output
        run: |
          test -s output/index.html || (echo "output/index.html is empty or missing" && exit 1)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./output

      # 翌日の前日比較用にスナップショットを残す。
      # 失敗してもデプロイは止めず、警告として実行画面に表示する。
      - name: Commit snapshots and keep repository active
        run: |
          date -u > .last_run
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last_run snapshots/
          git diff --staged --quiet || git commit -m "chore: daily snapshot $(TZ=Asia/Tokyo date +%Y%m%d)"
          git pull --rebase origin main || echo "::warning::git pull --rebase failed"
          git push || echo "::warning::snapshot push failed"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
